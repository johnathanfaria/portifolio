<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download My CV</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
    }
    /* NAVBAR (portfolio style) */
    .navbar-custom {
      width: 100%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      padding: 0;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      align-items: center;
      list-style: none;
      margin: 0;
      padding: 0;
      height: 70px;
      gap: 40px;
    }
    .nav-links a {
      font-size: 1.22rem;
      font-weight: 700;
      color: #223;
      padding: 10px 18px;
      text-decoration: none;
      border-radius: 6px;
      transition: color 0.2s, border-bottom 0.2s;
      border-bottom: 2.5px solid transparent;
      letter-spacing: 0.5px;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #1e67b7;
      border-bottom: 2.5px solid #1e67b7;
      background: #f3f7fc;
    }
    /* CV Download Section */
    .cv-section {
      text-align: center;
      padding: 100px 20px 50px 20px; /* Top padding for navbar */
      background-color: #ffffff;
      max-width: 800px;
      margin: 60px auto 0 auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .cv-section h2 {
      color: #1e67b7;
      margin-bottom: 20px;
      font-weight: 800;
      font-size: 2rem;
    }
    .cv-section p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 30px;
    }
    .cv-button {
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #007bff;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    .cv-button:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }
    @media (max-width: 650px) {
      .nav-links {
        gap: 16px;
      }
      .cv-section {
        padding: 90px 4px 30px 4px;
        margin-top: 50px;
      }
      .cv-section h2 { font-size: 1.15rem;}
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar-custom">
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="CV.html" class="active">Download CV</a></li>
    </ul>
  </nav>

  <!-- CV Download Section -->
  <section class="cv-section">
    <h2>Download My CV</h2>
    <p>Click the button below to download my Curriculum Vitae and stay updated with my professional achievements.</p>
    <a href="Johnathan Faria - Data Analyst 2025.pdf" class="cv-button" download>
      <i class="fas fa-download"></i> Download CV
    </a>
  </section>
</body>
</html>
